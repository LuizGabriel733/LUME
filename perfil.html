<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Perfil</title>
    <link rel="shortcut icon" type="imagex/png" href="./image/simbolo-lume.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<section id="perfil" class="perfil-page">
    <div class="perfil-shell">
        <div class="perfil-hero">
            <div class="perfil-avatar" id="perfilAvatar">U</div>
            <div class="perfil-meta">
                <p class="perfil-kicker">Perfil do usuário</p>
                <h1>Bem-vindo, <span id="user-name"></span>!</h1>
                <p class="perfil-email"><span id="user-email"></span></p>
                <div class="perfil-actions">
                    <button id="voltar">Voltar</button>
                    <button id="logout-button" class="secundario">Sair</button>
                </div>
            </div>
        </div>

        <div class="perfil-grid">
            <section class="perfil-panel wide">
                <div class="panel-head">
                    <h2>Seus ingressos</h2>
                    <span>Compras</span>
                </div>
                <ul id="user-tickets" class="perfil-list"></ul>
            </section>
        </div>

        <p id="status-message" class="perfil-status"></p>
    </div>
</section>

    <script src="https://www.gstatic.com/firebasejs/11.0.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.0.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="perfil.js"></script>
</body>
</html>
